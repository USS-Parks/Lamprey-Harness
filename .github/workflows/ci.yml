name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Lint + typecheck need only JS deps and @types — not the native
      # better-sqlite3 rebuild or the Electron binary download — so skip the
      # install scripts to keep this job fast.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # WC-7 — verify:proof is the canonical M10 proof policy gate. In CI
      # we use --no-tests because the sibling `test` job runs vitest under
      # coverage; this job's responsibility is the lint + tsc + script
      # composition check, plus surfacing any drift between the script
      # and the canonical gate semantics.
      - name: Proof policy static gate
        run: npm run verify:proof -- --no-tests

  test:
    # JM-29 (HY-9) — run the suite on BOTH platforms. Lamprey is Windows-first,
    # but CI used to run vitest on ubuntu only, so the Windows-guarded tests
    # (isWindows()/isWin32 cohort) never executed in CI and Windows-specific
    # regressions were invisible. ubuntu still uploads coverage; windows is a
    # correctness leg.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Vitest runs under Node and imports `electron`, whose main export throws
      # unless the binary is present — so install deps without scripts (fast,
      # no native rebuild) and then fetch just the Electron binary. The
      # better-sqlite3 native rebuild is intentionally skipped: the suite does
      # not load the real native DB, and rebuilding it for Electron's ABI would
      # make it unloadable under the Node-based test runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Unit + integration tests (with coverage)
        # `--coverage` prints the table in the CI log AND enforces the
        # thresholds pinned in vitest.config.ts (Prompt 12: floor =
        # baseline minus 2pp per metric — a regression guard, not a
        # quality target).
        # Keep real process-startup checks within their production deadlines on
        # the Windows runner; do not race them against other test-file workers.
        run: npm test -- --coverage ${{ runner.os == 'Windows' && '--maxWorkers=1' || '' }}

      - name: Upload coverage report
        # One coverage artifact is enough; upload from the ubuntu leg only.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  native-db:
    # AC-36 — ABI-guarded suites must run red/green under Electron's
    # ABI, not skip under the Node-based `test` job (v0.9.2 class of hole).
    # Walker finds files with HAS_NATIVE_SQLITE / nativeOk(). getDb()
    # suites set __setUserDataForTests so they run
    # without a ready Electron app.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Native DB suites under Electron ABI
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: npx electron scripts/test-native-db.cjs

      - name: Verification gate contracts
        run: node --test scripts/test-native-db.test.cjs scripts/pre-push-gate.test.cjs scripts/pre-push-scope.test.cjs scripts/bucket.test.cjs
